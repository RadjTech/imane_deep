# C8 : entraînement plus long, un ordinateur GitHub par essai (protocole : propositions/PROTOCOLE_C8_GITHUB.md).
# Déclenchement manuel uniquement : onglet Actions → « C8 entrainement long » → Run workflow.
#   petit-essai : 2 essais de quelques minutes, rien n'est enregistré (à faire en premier).
#   complet     : les 45 essais du protocole, puis les résultats sont enregistrés sur main par le robot GitHub.
# Aucun secret, aucune entrée libre : la liste des essais vient du code (scripts/c8_matrice.py).
name: C8 entrainement long
run-name: "C8 ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "petit-essai : 10 min, rien d'enregistre. complet : environ 2 h, resultats enregistres sur main."
        required: true
        default: petit-essai
        type: choice
        options:
          - petit-essai
          - complet

permissions:
  contents: read

concurrency:
  group: c8-entrainement-long
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrice: ${{ steps.liste.outputs.matrice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "numpy==2.3.5"
      - name: Garde-fous
        run: |
          set -euo pipefail
          python experiments/hybrid_numpy.py --check-grads
          python scripts/gardefou_conformite.py
          python scripts/c3b_controles.py --check
      - name: Le nouveau programme refait le debut de C7
        run: |
          set -euo pipefail
          for v in smax dlind-elu1 dlind-const; do python scripts/c8_github.py --controle-c7 --variante "$v"; done
      - name: Liste des essais
        id: liste
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python scripts/c8_matrice.py "$MODE" >> "$GITHUB_OUTPUT"

  entrainer:
    needs: preparer
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.preparer.outputs.matrice) }}
    env:
      VARIANTE: ${{ matrix.variante }}
      SEED: ${{ matrix.seed }}
      BUDGET: ${{ matrix.budget }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "numpy==2.3.5"
      - name: Entrainement
        shell: bash
        run: |
          set -euo pipefail
          TAG="c8g_${VARIANTE}_b${BUDGET}_s${SEED}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p "results/$TAG"
          python -u scripts/c8_github.py --variante "$VARIANTE" --seed "$SEED" --max-steps "$BUDGET" \
            --out-dir "results/$TAG" 2>&1 | tee train_run.log
          mv train_run.log "results/$TAG/train.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.TAG }}
          path: results/${{ env.TAG }}/
          retention-days: 60
          if-no-files-found: warn

  rassembler:
    needs: entrainer
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "numpy==2.3.5"
      - uses: actions/download-artifact@v4
        with:
          pattern: c8g_*
          path: artefacts
      - name: Ranger les essais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results artefacts
          find artefacts -mindepth 1 -maxdepth 1 -type d -exec cp -r {} results/ \;
          echo "Essais recuperes : $(find results -maxdepth 1 -type d -name 'c8g_*' | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Analyse pre-enregistree
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/analyse_c8_github.py --md propositions/RESULTATS_C8_brut.md > analyse.txt 2>&1; then
            echo "Analyse complete"
          else
            echo "Essais manquants : etat provisoire"
            python scripts/analyse_c8_github.py --incomplet > analyse.txt 2>&1 || true
          fi
          { echo '```'; cat analyse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: c8-resultats
          path: |
            results/c8g_*/
            results/c8g_analyse.json
            propositions/RESULTATS_C8_brut.md
            analyse.txt
            !**/*.npz
          retention-days: 90
          if-no-files-found: warn
      - name: Enregistrer les resultats sur main (mode complet)
        if: ${{ inputs.mode == 'complet' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if compgen -G "results/c8g_*" > /dev/null; then git add -- results/c8g_*; fi
          for f in results/c8g_analyse.json propositions/RESULTATS_C8_brut.md; do if [ -f "$f" ]; then git add -- "$f"; fi; done
          if git diff --cached --quiet; then echo "Rien a enregistrer"; exit 0; fi
          git commit -q -m "C8 (GitHub Actions) : resultats bruts de l'entrainement long"
          for essai in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "Enregistre sur main"; exit 0; fi
            sleep 20
          done
          echo "Envoi impossible : les resultats restent dans l'artefact c8-resultats"
          exit 1
